[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnisint"
version = "1.0.0"
description = "Omnisint — every OSINT source you have, one correlated profile"
requires-python = ">=3.10"
dependencies = ["rich>=13", "dnspython>=2.4"]

[project.optional-dependencies]
backends = ["maigret>=0.6", "holehe>=1.6", "user-scanner>=1.5", "sherlock-project>=0.15"]

[project.scripts]
omnisint = "omnisint.cli:main"
omni = "omnisint.cli:main"

[tool.setuptools.packages.find]
include = ["omnisint*"]
