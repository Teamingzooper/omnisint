name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Base install only. The suite must pass with no backends present,
      # because that is what a new user has — and "missing backend" is a
      # supported state, not a broken one.
      - name: Install
        run: python -m pip install --upgrade pip .

      - name: Logic and correlation tests
        run: python tests/test_logic.py

      - name: Web UI tests
        run: python tests/test_web.py

      - name: The sample report still builds from synthetic data
        run: python examples/make_sample.py

      - name: CLI responds with nothing else installed
        run: |
          omnisint --version
          omnisint tools
          omni --help

      # The catalogue is package data, so it can go missing from an install
      # without any import failing.
      - name: Catalogue loads from the installed package
        run: |
          python -c "
          from omnisint.catalog import counts, attribution
          c = counts()
          assert sum(c.values()) > 500, c
          assert 'Nordine' in attribution()
          print('catalogue ok:', c)
          "
