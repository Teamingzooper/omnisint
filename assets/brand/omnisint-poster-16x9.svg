<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#c084fc"/>
  </linearGradient>
  <linearGradient id="brandH" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#c084fc"/>
  </linearGradient>
  <radialGradient id="bg" cx="25%" cy="50%" r="85%">
    <stop offset="0" stop-color="#101a2e"/><stop offset=".55" stop-color="#080c16"/>
    <stop offset="1" stop-color="#04060b"/>
  </radialGradient>
  <radialGradient id="halo" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#22d3ee" stop-opacity=".22"/>
    <stop offset=".55" stop-color="#c084fc" stop-opacity=".07"/>
    <stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="fade" cx="560" cy="540" r="440" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#000"/><stop offset=".47" stop-color="#000"/>
    <stop offset=".62" stop-color="#fff"/><stop offset="1" stop-color="#fff"/>
  </radialGradient>
  <mask id="lineMask"><rect width="1920" height="1080" fill="url(#fade)"/></mask>
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M60 0H0V60" fill="none" stroke="#22d3ee" stroke-width="1" opacity=".055"/>
  </pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="16" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="1920" height="1080" fill="url(#bg)"/>
<rect width="1920" height="1080" fill="url(#grid)"/>
<circle cx="560" cy="540" r="520" fill="url(#halo)"/>

